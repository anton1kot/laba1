[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laba1"
version = "0.1.0"
description = "Simple CLI-package with calculator and units converter"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolkit*"]